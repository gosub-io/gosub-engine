[package]
name = "gosub_ipc"
version = "0.1.0"
edition = "2021"
authors = ["Gosub Community <info@gosub.io>"]
license = "MIT"
description = "Gosub inter-process transport: length-framed messaging, fd passing, shared-memory tiles and body rings"

[features]
default = ["multi-process"]
# Compiles in the cross-process transports (socket/pipe channels, fd passing,
# shared memory). Without it only the in-process `Endpoint` variant exists, so
# components written against `Endpoint` still build and run as threads — the
# configuration wasm and platforms without process isolation use.
multi-process = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
bincode = { workspace = true }

# libc: socketpair fd passing (all Unix) plus the memfd/futex primitives behind
# the sealed tiles and the body ring (Linux).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# windows-sys: anonymous-pipe transport (CreatePipe), handle inheritance
# (SetHandleInformation) and the CancelIoEx deadline watchdog.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

# The workspace forbids unsafe_code; this crate and gosub_sandbox are the two
# exceptions, and the pair is the quarantine: every raw OS primitive the engine
# needs (socketpair, sendmsg/SCM_RIGHTS, mmap, memfd, futex) lives here, so the
# rest of the workspace keeps the forbid. The opt-out is crate-wide rather than
# per-site because unsafe is this crate's whole substance — auditing means
# reading the crate, not chasing allow attributes. Each block still carries a
# SAFETY comment.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
