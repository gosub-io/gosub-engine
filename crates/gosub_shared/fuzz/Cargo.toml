[package]
name = "gosub-shared-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gosub_shared = { path = ".." }
# The parser usvg ships with; keep in step with resvg.
roxmltree = "0.21.1"

# Keep this crate out of the parent workspace
[workspace]
members = ["."]

[[bin]]
name = "svg_limits"
path = "fuzz_targets/svg_limits.rs"
test = false
doc = false
