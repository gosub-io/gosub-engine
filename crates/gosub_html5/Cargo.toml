[package]
name = "gosub_html5"
version = "0.1.1"
edition = "2021"
authors = ["Gosub Community <info@gosub.io>"]
license = "MIT"
description = "HTML5 parser for Gosub"

[dependencies]
gosub_shared = { version = "0.1.1", registry = "gosub", path = "../gosub_shared", features = [] }
gosub_interface = { version = "0.1.1", registry = "gosub", path = "../gosub_interface", features = [] }
gosub_css3 = { version = "0.1.1", registry = "gosub", path = "../gosub_css3", features = [] }
phf = { version = "0.14.0", features = ["macros"] }
lazy_static = { workspace = true }
url = { workspace = true, features = [] }
log = { workspace = true, features = [] }
nom = { workspace = true }
nom_locate = "5.0.0"
regex = { workspace = true }
indexmap = "2.13.0"
serde_json = { workspace = true, features = ["preserve_order"] }
serde = { workspace = true, features = ["derive"] }
cow-utils = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[dev-dependencies]
test-case = { workspace = true }
parking_lot = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
flate2 = "1"
gosub_html5 = { path = ".", features = ["testing"] }


[features]
debug_parser = []
debug_parser_verbose = []
# The html5lib test harness in `gosub_html5::testing`, for tests, benches and test runners.
testing = []


# These use `gosub_html5::testing`. The self dev-dependency above turns `testing` on in the
# workspace, but `cargo package` drops it, so the packaged crate needs `--features testing`.
[[test]]
name = "adoption_agency"
required-features = ["testing"]

[[test]]
name = "form_end_tag"
required-features = ["testing"]

[[test]]
name = "fragment_form_pointer"
required-features = ["testing"]

[[test]]
name = "mathml_text_integration_point"
required-features = ["testing"]

[[test]]
name = "shadow_dom"
required-features = ["testing"]

[[bench]]
name = "tokenizer"
harness = false
required-features = ["testing"]

[[bench]]
name = "tree_construction"
harness = false
required-features = ["testing"]

[[bench]]
name = "html_parser"
harness = false
required-features = ["testing"]

# Mirrors the workspace lints, except unsafe_code is "deny" instead of "forbid":
# the html_parser bench installs a counting GlobalAlloc, which requires unsafe
# (allowed at file level there).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
mod_module_files = "deny"
