[package]
name = "gosub_css3"
version = "0.1.2"
edition = "2021"
authors = ["Gosub Community <info@gosub.io>"]
license = "MIT"
description = "CSS3 parser for Gosub"

[dependencies]
gosub_shared = { version = "0.1.1", registry = "gosub", path = "../gosub_shared", features = [] }
gosub_interface = { version = "0.1.1", registry = "gosub", path = "../gosub_interface", features = [] }
log = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true, features = [] }
colors-transform = "0.2.11"
compact_str = "0.9.1"
smallvec = "1.15.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
nom = { workspace = true }
cow-utils = { workspace = true }
indexmap = { version = "2.13.0", optional = true }

[dev-dependencies]
simple_logger = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }

[[bench]]
name = "css_parser"
harness = false

[features]
default = []
unresolved_syntax = ["dep:indexmap"]

# Mirrors the workspace lints, except unsafe_code is "deny" instead of "forbid":
# the css_parser bench installs a counting GlobalAlloc, which requires unsafe
# (allowed at file level there).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
mod_module_files = "deny"
