[package]
name = "gosub_v8"
version = "0.1.2"
edition = "2021"
authors = ["Gosub Community <info@gosub.io>"]
license = "MIT"
description = "V8 bindings for Gosub"

[dependencies]
log = { workspace = true }
gosub_shared = { version = "0.1.1", registry = "gosub", path = "../gosub_shared" }
gosub_webexecutor = { version = "0.1.1", registry = "gosub", path = "../gosub_webexecutor" }
v8 = "152.2.0"
anyhow = { workspace = true }
getrandom = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
gosub_webinterop = { version = "0.1.1", registry = "gosub", path = "../gosub_webinterop" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gosub_sandbox = { version = "0.1.0", registry = "gosub", path = "../gosub_sandbox" }

[[test]]
name = "sandboxed_jitless"
harness = false

# Mirrors the workspace lints, except unsafe_code: this is an FFI binding crate
# around the V8 C++ API, where unsafe is inherent to nearly every operation.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
mod_module_files = "deny"
