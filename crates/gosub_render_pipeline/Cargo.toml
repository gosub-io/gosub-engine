[package]
name = "gosub_render_pipeline"
version = "0.1.0"
edition = "2021"
license = "MIT"
autobins = false

[dependencies]
# `calc` is deliberately OFF. CSS calc() is resolved in gosub_css3 (functions/math.rs) long
# before values reach taffy, so the feature buys nothing here - and leaving it off is what makes
# the `unsafe impl Send` on `SendTaffyTree` (layouter/taffy.rs) provable rather than merely
# probable: without it `CompactLength::calc` does not exist, so taffy's tagged word can never
# hold a real pointer. Do not re-enable without reading that safety comment.
taffy = { workspace = true, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
log = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif"] }
png = { workspace = true }
sha2 = "0.11.0"
serde_json = { workspace = true }
csscolorparser = "0.8.3"
rstar = "0.13.0"
gosub-sonar = "0.6.0"
url = { workspace = true }
resvg = { workspace = true }
bytes = { workspace = true }
bytemuck = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
cow-utils = { workspace = true }
parking_lot = { workspace = true }
gosub_shared = { version = "0.1.1", path = "../gosub_shared", registry = "gosub" }
rayon = "1"
gosub_interface = { version = "0.1.2", path = "../gosub_interface", registry = "gosub" }
gosub_fontmanager = { version = "0.1.0", path = "../gosub_fontmanager", registry = "gosub" }
gosub_lattice = { version = "0.1.0", path = "../gosub_lattice", registry = "gosub" }

[dev-dependencies]
gosub_html5 = { path = "../gosub_html5", registry = "gosub" }
# Only to build an SVGZ fixture for the depth-limit regression test.
flate2 = "1"
gosub_css3 = { path = "../gosub_css3", registry = "gosub" }
url = { workspace = true }
tempfile = { workspace = true }

# Mirrors the workspace lints, except unsafe_code is "deny" instead of "forbid":
# ExternalHandle carries raw GPU/surface handles and needs unsafe Send/Sync impls,
# which are allowed per-site with a justification.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
