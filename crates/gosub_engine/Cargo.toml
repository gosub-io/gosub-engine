[package]
name = "gosub_engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "gosub_engine"
crate-type = ["rlib"]

[dependencies]
gosub-sonar = "0.3.0"
gosub_shared = { version = "0.1.1", path = "../gosub_shared" }
gosub_config = { version = "0.1.1", path = "../gosub_config" }
gosub_html5 = { version = "0.1.1", path = "../gosub_html5" }
gosub_css3 = { version = "0.1.2", path = "../gosub_css3" }
gosub_interface = { version = "0.1.2", path = "../gosub_interface" }
gosub_fontmanager = { version = "0.1.0", path = "../gosub_fontmanager", registry = "gosub" }
gosub_renderer_cairo = { version = "0.1.0", path = "../gosub_renderer_cairo", registry = "gosub", default-features = false, optional = true }
gosub_renderer_skia = { version = "0.1.0", path = "../gosub_renderer_skia", registry = "gosub", default-features = false, optional = true }
gosub_render_pipeline = { version = "0.1.0", path = "../gosub_render_pipeline" }
uuid = { workspace = true, features = ["v4", "serde"] }
reqwest = { workspace = true, default-features = true, features = ["json", "gzip", "brotli", "deflate", "cookies", "rustls", "stream"] }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "full",
    "tracing",
    "io-util",
] }
thiserror = { workspace = true }
rand = { workspace = true }
futures = { workspace = true, features = ["executor"] }
anyhow = { workspace = true }
http = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true, features = ["derive"] }
gosub_ipc = { version = "0.1.0", path = "../gosub_ipc", optional = true }
gosub_sandbox = { version = "0.1.0", path = "../gosub_sandbox", optional = true }
serde_json = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }

r2d2 = { version = "0.8", optional = true }
r2d2_sqlite = { version = "0.34", optional = true, features = ["bundled"] }

time = "0.3.41"
tokio-util = { workspace = true, features = ["io"] }
bitflags = "2.11.1"
futures-util = { workspace = true }
cow-utils = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
once_cell = { workspace = true }
psl = "2"
parking_lot = { workspace = true }
mime = "0.3.17"
chrono = { workspace = true }
regex = { workspace = true }
mimetype-detector = "0.3.11"
image = { workspace = true }
async-trait = "0.1.89"
allsorts = "0.17"

# Exercises the isolated components from a binary that dispatches child roles the
# way an embedder must; `tests/process_isolation.rs` runs it. Pointless without
# the machinery it drives.
[[bin]]
name = "isolation-harness"
path = "src/bin/isolation-harness.rs"
required-features = ["process-isolation"]

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["sqlite_cookie_store", "process-isolation"]
sqlite_cookie_store = ["r2d2", "r2d2_sqlite"]
sqlite_places = ["r2d2", "r2d2_sqlite"]
metrics = []
# Compiles in the ability to run the network stack as a separate, sandboxed
# process. Off leaves the engine single-process, which is what wasm and any
# platform without process isolation need; the fetch path is otherwise identical.
# Compiling it in does not enable it — see the `security.network_process` setting.
process-isolation = ["dep:gosub_ipc", "dep:gosub_sandbox"]
# Compile the feature-gated font systems into the isolation harness, so its
# font scenarios can be pointed at every backend the engine supports — the
# confinement contract has to hold per font stack, not just for the default.
# Diagnostic only; nothing in the engine itself selects these.
pango-fonts = ["gosub_fontmanager/pango"]
skia-fonts = ["gosub_fontmanager/skia"]
# Stage-6 rasterization in the isolation harness's forked renderers: the Cairo
# CPU rasterizer, minus its GTK/Pango default features. Diagnostic, like the
# font features — a real embedder supplies its own rasterizer through
# `RenderConfiguration::forked_tile_rasterizer`.
cairo-tiles = ["dep:gosub_renderer_cairo"]
# Same, with Skia's CPU rasterizer (`cairo-tiles` wins when both are on).
skia-tiles = ["dep:gosub_renderer_skia"]

[lints]
workspace = true
