[package]
name = "gosub_engine"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "gosub_engine"
crate-type = ["rlib"]

[dependencies]
gosub-sonar = "0.2.0"
gosub_shared = { version = "0.1.1", path = "../gosub_shared" }
gosub_config = { version = "0.1.1", path = "../gosub_config" }
gosub_html5 = { version = "0.1.1", path = "../gosub_html5" }
gosub_css3 = { version = "0.1.2", path = "../gosub_css3" }
gosub_interface = { version = "0.1.2", path = "../gosub_interface" }
gosub_fontmanager = { version = "0.1.0", path = "../gosub_fontmanager", registry = "gosub" }
gosub_render_pipeline = { version = "0.1.0", path = "../gosub_render_pipeline" }
uuid = { workspace = true, features = ["v4", "serde"] }
reqwest = { workspace = true, default-features = true, features = ["json", "gzip", "brotli", "deflate", "cookies", "rustls", "stream"] }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "full",
    "tracing",
    "io-util",
] }
thiserror = { workspace = true }
rand = { workspace = true }
futures = { workspace = true, features = ["executor"] }
anyhow = { workspace = true }
http = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }

r2d2 = { version = "0.8", optional = true }
r2d2_sqlite = { version = "0.34", optional = true, features = ["bundled"] }

time = "0.3.41"
tokio-util = { workspace = true, features = ["io"] }
bitflags = "2.11.1"
futures-util = { workspace = true }
cow-utils = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
once_cell = { workspace = true }
psl = "2"
parking_lot = { workspace = true }
mime = "0.3.17"
chrono = { workspace = true }
regex = { workspace = true }
mimetype-detector = "0.3.11"
image = { workspace = true }
async-trait = "0.1.89"
allsorts = "0.17"

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = ["sqlite_cookie_store"]
sqlite_cookie_store = ["r2d2", "r2d2_sqlite"]
metrics = []

[lints]
workspace = true
