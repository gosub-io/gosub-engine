[package]
name = "gosub_renderer_skia"
version = "0.1.0"
edition = "2021"
description = "Skia rasterizer and compositor backend for the Gosub render pipeline"
license = "MIT"

[dependencies]
gosub_render_pipeline = { version = "0.1.0", path = "../gosub_render_pipeline" }
gosub_fontmanager = { version = "0.1.0", path = "../gosub_fontmanager", registry = "gosub", features = ["skia"] }
gosub_interface = { version = "0.1.1", path = "../gosub_interface", registry = "gosub" }
log = { workspace = true }
anyhow = { workspace = true }
parking_lot = { workspace = true }
resvg = { workspace = true }

skia-safe = { workspace = true, features = ["textlayout"] }

# Not on Windows: the prebuilt key covers target and features, and no Windows bundle has
# wayland or x11, so asking for them there builds Skia from source, which needs Visual
# Studio. Linux and macOS keep the union they always had.
[target.'cfg(not(target_os = "windows"))'.dependencies]
skia-safe = { workspace = true, features = ["wayland", "x11"] }

[lints]
workspace = true
