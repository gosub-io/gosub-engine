name: Gosub Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs: without this, every push to a PR leaves the previous
# full CI run burning runners to completion alongside the new one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debuginfo in CI: not needed for pass/fail, and it roughly halves both
  # cold-build time and cache size for the big dep graphs (skia, vello, gtk).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust_version: [ stable, nightly, 1.92.0 ]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust_version }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Key must be unique per job: caches are immutable per key, so if
          # jobs share one, whichever finishes first on main saves its (possibly
          # artifact-less) cache and the others rebuild from scratch on every PR.
          shared-key: test-${{ matrix.rust_version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: sudo apt update -y && sudo apt install sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev -y
      - uses: taiki-e/install-action@nextest
      - name: Build and test
        run: cargo nextest run --locked --all --no-fail-fast
      - name: Doctests
        run: cargo test --doc --locked --all

  wpt:
    runs-on: ubuntu-24.04
    # This job checks out third-party content (web-platform-tests); keep the token
    # read-only and out of .git/config
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wpt
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: sudo apt update -y && sudo apt install sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev -y
      - uses: taiki-e/install-action@nextest
      - name: Checkout web-platform-tests (sparse, pinned)
        run: |
          git clone --filter=blob:none --sparse https://github.com/web-platform-tests/wpt.git "$RUNNER_TEMP/wpt"
          cd "$RUNNER_TEMP/wpt"
          git sparse-checkout set resources common dom/nodes dom/events html/dom
          git checkout "$(cat "$GITHUB_WORKSPACE/tests/wpt/wpt-commit.txt")"
      - name: Run the WPT suites
        run: cargo nextest run --locked --release -p gosub-wpt --test wpt_conformance --no-capture
        env:
          WPT_ROOT: ${{ runner.temp }}/wpt
      # The gate above is pass/fail; this is the readable view of where the engine
      # actually stands. Always runs, so a failing gate still produces a report.
      - name: Build the coverage report
        if: always()
        run: |
          cargo run --locked --release -p gosub-wpt -- "$RUNNER_TEMP/wpt" --all \
              --expect tests/wpt/expectations.txt --report "$RUNNER_TEMP/wpt-report.html" \
              > "$RUNNER_TEMP/wpt-run.txt" || true
          # The binary reports per file; the run-wide total is summed here.
          # POSIX awk only - the runner's default awk is mawk, which has no 3-arg match().
          {
            echo "### WPT (dom/events, html/dom)"
            echo ""
            awk '/: [0-9]+ passed/ {
                   n = split($0, a, ": "); m = split(a[n], b, ", ")
                   for (i = 1; i <= m; i++) {
                     split(b[i], c, " ")
                     if (c[2] == "passed")      p += c[1]
                     else if (c[2] == "failed") f += c[1]
                     else if (c[2] == "known")  k += c[1]
                   }
                   suites++
                 }
                 END {
                   t = p + f + k
                   printf "%d suites, %d subtests - **%d passed** (%.1f%%), %d failed, %d known\\n",
                          suites, t, p, t ? 100 * p / t : 0, f, k
                 }' "$RUNNER_TEMP/wpt-run.txt"
            echo ""
            echo "Full breakdown in the \\`wpt-report\\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wpt-report
          path: ${{ runner.temp }}/wpt-report.html
          if-no-files-found: warn

  clippy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust_version: [ stable, nightly ]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust_version }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-${{ matrix.rust_version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: sudo apt update -y && sudo apt install sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev -y
      - name: Run Clippy
        run: cargo clippy --locked --all --all-targets -- -D warnings

  check-features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Separate cache: all-features artifacts (skia, vello, gtk) differ
          # heavily from the default-features builds of the other jobs.
          shared-key: all-features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: sudo apt update -y && sudo apt install sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev -y
      - uses: taiki-e/install-action@nextest
      - name: Clippy with all features
        run: cargo clippy --locked --all --all-targets --all-features -- -D warnings
      - name: Test with all features
        run: cargo nextest run --locked --all --all-features --no-fail-fast

  # The process-isolation crates on the platforms the Linux jobs above never
  # see. Ported from the proof of concept's CI, which type-checked darwin and
  # windows-msvc rows for the same reason: `target_os` seams and PoC-imported
  # platform backends break silently when only Linux ever compiles them (two
  # such breaks sat unnoticed on the branch until a cross-check ran).
  #
  # Scoped to the three crates on purpose. The workspace as a whole cannot build
  # here - V8 has no prebuilt for these rows and the GUI crates want GTK - and
  # these are the crates whose behaviour differs per platform. Native runners,
  # so no cross `cc`; each row runs twice: default features, and isolation off
  # (`multi-process`/`process-isolation` disabled - what wasm and any platform
  # without a sandbox build; the engine keeps its bundled sqlite so the row
  # does not become a test of the runner's system libraries).
  cross-compile:
    name: check (${{ matrix.target }}, isolation ${{ matrix.isolation }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, isolation: enabled }
          - { os: macos-latest, target: aarch64-apple-darwin, isolation: disabled }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, isolation: enabled }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, isolation: disabled }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-${{ matrix.target }}-${{ matrix.isolation }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check (isolation enabled)
        if: matrix.isolation == 'enabled'
        run: cargo check --locked -p gosub_ipc -p gosub_sandbox --all-targets --target ${{ matrix.target }}
      - name: Check (isolation disabled)
        if: matrix.isolation == 'disabled'
        run: cargo check --locked -p gosub_ipc -p gosub_sandbox --all-targets --target ${{ matrix.target }} --no-default-features

  # The platforms whose sandbox backend can be *run*, not only type-checked:
  # the Seatbelt (macOS) and mitigation-policy (Windows) probes in
  # gosub_sandbox, and the engine's network/decoder-process scenarios there.
  # Linux is covered by `test`. Also from the proof of concept's CI.
  native-tests:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: Test
        run: cargo nextest run --locked -p gosub_ipc -p gosub_sandbox --no-fail-fast

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # No rust-cache here: cargo fmt compiles nothing, and saving a cache from
      # this job would poison the key it shares with compiling jobs.
      - name: Run fmt
        run: cargo fmt --check --all

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
