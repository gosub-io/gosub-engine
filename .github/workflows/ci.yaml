name: Gosub Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:

# Cancel superseded runs: without this, every push to a PR leaves the previous
# full CI run burning runners to completion alongside the new one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debuginfo in CI: not needed for pass/fail, and it roughly halves both
  # cold-build time and cache size for the big dep graphs (skia, vello, gtk).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust_version: [ stable, nightly, 1.92.0 ]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ matrix.rust_version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-${{ matrix.rust_version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: |
          sudo grep -rlZ -e dl.google.com -e packages.microsoft.com \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt update -y
          sudo apt install -y sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev \
            libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - name: Build and test
        run: cargo nextest run --locked --all --no-fail-fast
      - name: Doctests
        run: cargo test --doc --locked --all

  wpt:
    runs-on: ubuntu-24.04
    # This job checks out third-party content (web-platform-tests); keep the token
    # read-only and out of .git/config
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wpt
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: |
          sudo grep -rlZ -e dl.google.com -e packages.microsoft.com \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt update -y
          sudo apt install -y sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev \
            libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - name: Checkout web-platform-tests (sparse, pinned)
        run: |
          git clone --filter=blob:none --sparse https://github.com/web-platform-tests/wpt.git "$RUNNER_TEMP/wpt"
          cd "$RUNNER_TEMP/wpt"
          # html/resources holds common.js, which html/dom/elements/name-content-attribute-and-property.html loads.
          git sparse-checkout set resources common dom/nodes dom/events html/dom html/resources
          git checkout "$(cat "$GITHUB_WORKSPACE/tests/wpt/wpt-commit.txt")"
      - name: Run the WPT suites
        run: cargo nextest run --locked --release -p gosub-wpt --test wpt_conformance --no-capture
        env:
          WPT_ROOT: ${{ runner.temp }}/wpt
      - name: Build the coverage report
        if: always()
        run: |
          cargo run --locked --release -p gosub-wpt -- "$RUNNER_TEMP/wpt" --all \
              --expect tests/wpt/expectations.txt --report "$RUNNER_TEMP/wpt-report.html" \
              > "$RUNNER_TEMP/wpt-run.txt" || true
          # The binary reports per file; the run-wide total is summed here.
          # POSIX awk only - the runner's default awk is mawk, which has no 3-arg match().
          {
            echo "### WPT (dom/events, html/dom)"
            echo ""
            awk '/: [0-9]+ passed/ {
                   n = split($0, a, ": "); m = split(a[n], b, ", ")
                   for (i = 1; i <= m; i++) {
                     split(b[i], c, " ")
                     if (c[2] == "passed")      p += c[1]
                     else if (c[2] == "failed") f += c[1]
                     else if (c[2] == "known")  k += c[1]
                   }
                   suites++
                 }
                 END {
                   t = p + f + k
                   printf "%d suites, %d subtests - **%d passed** (%.1f%%), %d failed, %d known\\n",
                          suites, t, p, t ? 100 * p / t : 0, f, k
                 }' "$RUNNER_TEMP/wpt-run.txt"
            echo ""
            echo "Full breakdown in the \\`wpt-report\\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wpt-report
          path: ${{ runner.temp }}/wpt-report.html
          if-no-files-found: warn

  clippy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust_version: [ stable, nightly ]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ matrix.rust_version }}
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy-${{ matrix.rust_version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: |
          sudo grep -rlZ -e dl.google.com -e packages.microsoft.com \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt update -y
          sudo apt install -y sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev \
            libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev
      - name: Run Clippy
        run: cargo clippy --locked --all --all-targets -- -D warnings

  check-features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: all-features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: |
          sudo grep -rlZ -e dl.google.com -e packages.microsoft.com \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt update -y
          sudo apt install -y sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev \
            libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - name: Embedders dispatch child roles
        # Every binary that builds a GosubEngine must call child_process::dispatch()
        # first thing in main(), or process isolation re-execs its own startup.
        run: |
          missing=$(grep -rlE 'GosubEngine(::<|<|::new)' examples bin --include='*.rs' | xargs grep -L 'child_process::dispatch' || true)
          if [ -n "$missing" ]; then echo "missing child_process::dispatch():"; echo "$missing"; exit 1; fi
      - name: Clippy with all features
        run: cargo clippy --locked --all --all-targets --all-features -- -D warnings
      - name: Test with all features
        run: cargo nextest run --locked --all --all-features --no-fail-fast

  # The process-isolation crates on the platforms the Linux jobs above never
  # see. Ported from the proof of concept's CI, which type-checked darwin and
  # windows-msvc rows for the same reason: `target_os` seams and PoC-imported
  # platform backends break silently when only Linux ever compiles them (two
  # such breaks sat unnoticed on the branch until a cross-check ran).
  #
  # Scoped to the two isolation crates and the engine on purpose. The workspace
  # as a whole cannot build here - V8 has no prebuilt for these rows and the GUI
  # crates want GTK - and these are the crates whose behaviour differs per
  # platform. Native runners, so no cross `cc`; each row runs twice: default
  # features, and isolation off (`multi-process`/`process-isolation` disabled -
  # what wasm and any platform without a sandbox build; the engine keeps its
  # bundled sqlite so the row does not become a test of the runner's system
  # libraries).
  cross-compile:
    name: check (${{ matrix.target }}, isolation ${{ matrix.isolation }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, isolation: enabled }
          - { os: macos-latest, target: aarch64-apple-darwin, isolation: disabled }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, isolation: enabled }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, isolation: disabled }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cross-${{ matrix.target }}-${{ matrix.isolation }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check (isolation enabled)
        if: matrix.isolation == 'enabled'
        run: cargo check --locked -p gosub_ipc -p gosub_sandbox -p gosub_engine --all-targets --target ${{ matrix.target }}
      - name: Check (isolation disabled)
        if: matrix.isolation == 'disabled'
        run: cargo check --locked -p gosub_ipc -p gosub_sandbox -p gosub_engine --all-targets --target ${{ matrix.target }} --no-default-features --features gosub_engine/sqlite_cookie_store

  # The platforms whose sandbox backend can be *run*, not only type-checked:
  # the Seatbelt (macOS) and mitigation-policy (Windows) probes in
  # gosub_sandbox, gosub_ipc's transport tests, and the engine's
  # network/decoder-process scenarios.
  # Linux is covered by `test`. Also from the proof of concept's CI.
  native-tests:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest
      - name: Test
        run: cargo nextest run --locked -p gosub_ipc -p gosub_sandbox -p gosub_engine --no-fail-fast

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt
      - name: Run fmt
        run: cargo fmt --check --all

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
