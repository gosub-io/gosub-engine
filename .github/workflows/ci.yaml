name: Gosub Continuous Integration (CI)

on:
  push:
    branches: [ main ]
  pull_request:
  # The full run, on any branch, by hand.
  workflow_dispatch:

# Two sizes of run. The full one is for main: pushes, PRs into it, and runs started by
# hand. A PR into any other branch (a feature branch such as javascript-v8) gets the
# quick one: stable only, Linux only. The rest runs once the feature branch goes into
# main. GitHub Actions has no variables for `if:` and matrices, so the test is written
# out where it is used:
#   github.event_name != 'pull_request' || github.base_ref == 'main'

# Cancel superseded runs: without this, every push to a PR leaves the previous
# full CI run burning runners to completion alongside the new one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debuginfo in CI: not needed for pass/fail, and it roughly halves both
  # cold-build time and cache size for the big dep graphs (skia, vello, gtk).
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust_version: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main') && '["stable", "nightly", "1.92.0"]' || '["stable"]') }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust_version }}
      # Dependencies at opt-level 2, the workspace stays at 0: the deps come from the
      # cache, so this costs build time only on a cache miss, and the heavy layout and
      # soak tests run several times faster. Debug assertions and overflow checks are
      # untouched. The `-optdeps` cache keys keep these builds apart from opt-level 0 ones.
      - name: Optimise dependencies
        shell: bash
        run: |
          # Not there yet on the macOS runners.
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          printf '[profile.dev.package."*"]\nopt-level = 2\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-${{ matrix.rust_version }}-optdeps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Refresh the apt index
        run: |
          sudo grep -rlZ -e dl.google.com -e packages.microsoft.com \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt update -y
      # Restored from the actions cache instead of installed on every job; bump
      # `version` to force a fresh install. On a miss the action installs without
      # refreshing the index itself (it only does so under nektos/act), hence the
      # update above.
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev
          version: 1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - name: Build and test
        run: cargo nextest run --locked --all --no-fail-fast
      - name: Doctests
        run: cargo test --doc --locked --all

  wpt:
    runs-on: ubuntu-24.04
    # This job checks out third-party content (web-platform-tests); keep the token
    # read-only and out of .git/config
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: wpt
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Refresh the apt index
        run: |
          sudo grep -rlZ -e dl.google.com -e packages.microsoft.com \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt update -y
      # Restored from the actions cache instead of installed on every job; bump
      # `version` to force a fresh install. On a miss the action installs without
      # refreshing the index itself (it only does so under nektos/act), hence the
      # update above.
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev
          version: 1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - name: Checkout web-platform-tests (sparse, pinned)
        run: |
          git clone --filter=blob:none --sparse https://github.com/web-platform-tests/wpt.git "$RUNNER_TEMP/wpt"
          cd "$RUNNER_TEMP/wpt"
          # html/resources holds common.js, which html/dom/elements/name-content-attribute-and-property.html loads.
          git sparse-checkout set resources common dom/nodes dom/events html/dom html/resources
          git checkout "$(cat "$GITHUB_WORKSPACE/tests/wpt/wpt-commit.txt")"
      - name: Run the WPT suites
        run: cargo nextest run --locked --release -p gosub-wpt --test wpt_conformance --no-capture
        env:
          WPT_ROOT: ${{ runner.temp }}/wpt
      - name: Build the coverage report
        if: always()
        run: |
          cargo run --locked --release -p gosub-wpt -- "$RUNNER_TEMP/wpt" --all \
              --expect tests/wpt/expectations.txt --report "$RUNNER_TEMP/wpt-report.html" \
              > "$RUNNER_TEMP/wpt-run.txt" || true
          # The binary reports per file; the run-wide total is summed here.
          # POSIX awk only - the runner's default awk is mawk, which has no 3-arg match().
          {
            echo "### WPT (dom/events, html/dom)"
            echo ""
            awk '/: [0-9]+ passed/ {
                   n = split($0, a, ": "); m = split(a[n], b, ", ")
                   for (i = 1; i <= m; i++) {
                     split(b[i], c, " ")
                     if (c[2] == "passed")      p += c[1]
                     else if (c[2] == "failed") f += c[1]
                     else if (c[2] == "known")  k += c[1]
                   }
                   suites++
                 }
                 END {
                   t = p + f + k
                   printf "%d suites, %d subtests - **%d passed** (%.1f%%), %d failed, %d known\\n",
                          suites, t, p, t ? 100 * p / t : 0, f, k
                 }' "$RUNNER_TEMP/wpt-run.txt"
            echo ""
            echo "Full breakdown in the \\`wpt-report\\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wpt-report
          path: ${{ runner.temp }}/wpt-report.html
          if-no-files-found: warn

  clippy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust_version: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main') && '["stable", "nightly"]' || '["stable"]') }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.rust_version }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy-${{ matrix.rust_version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Refresh the apt index
        run: |
          sudo grep -rlZ -e dl.google.com -e packages.microsoft.com \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt update -y
      # Restored from the actions cache instead of installed on every job; bump
      # `version` to force a fresh install. On a miss the action installs without
      # refreshing the index itself (it only does so under nektos/act), hence the
      # update above.
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev
          version: 1
      - name: Run Clippy
        run: cargo clippy --locked --all --all-targets -- -D warnings

  check-features:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      # As in `test`.
      - name: Optimise dependencies
        shell: bash
        run: |
          # Not there yet on the macOS runners.
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          printf '[profile.dev.package."*"]\nopt-level = 2\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: all-features-optdeps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Refresh the apt index
        run: |
          sudo grep -rlZ -e dl.google.com -e packages.microsoft.com \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -0 -r rm -f
          sudo apt update -y
      # Restored from the actions cache instead of installed on every job; bump
      # `version` to force a fresh install. On a miss the action installs without
      # refreshing the index itself (it only does so under nektos/act), hence the
      # update above.
      - name: Install dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: sqlite3 libsqlite3-dev libglib2.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev libpango1.0-dev libgtk-4-dev
          version: 1
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - name: Embedders dispatch child roles
        # Every binary that builds a GosubEngine must call child_process::dispatch()
        # first thing in main(), or process isolation re-execs its own startup.
        run: |
          missing=$(grep -rlE 'GosubEngine(::<|<|::new)' examples bin --include='*.rs' | xargs grep -L 'child_process::dispatch' || true)
          if [ -n "$missing" ]; then echo "missing child_process::dispatch():"; echo "$missing"; exit 1; fi
      - name: Clippy with all features
        run: cargo clippy --locked --all --all-targets --all-features -- -D warnings
      - name: Test with all features
        run: cargo nextest run --locked --all --all-features --no-fail-fast

  # The process-isolation crates on the platforms the Linux jobs above never
  # see, in one job per OS so a run holds one macOS and one Windows runner, not
  # three of each (macOS runners are scarce and runs queued behind each other).
  #
  # Test: the platforms whose sandbox backend can be *run*, not only
  # type-checked: the Seatbelt (macOS) and mitigation-policy (Windows) probes in
  # gosub_sandbox, gosub_ipc's transport tests, and the engine's
  # network/decoder-process scenarios. Linux is covered by `test`.
  #
  # Check: ported from the proof of concept's CI, which type-checked darwin and
  # windows-msvc rows for the same reason: `target_os` seams and PoC-imported
  # platform backends break silently when only Linux ever compiles them (two
  # such breaks sat unnoticed on the branch until a cross-check ran). Each
  # target is checked twice: default features, and isolation off
  # (`multi-process`/`process-isolation` disabled - what wasm and any platform
  # without a sandbox build; the engine keeps its bundled sqlite so the check
  # does not become a test of the runner's system libraries).
  #
  # Scoped to the two isolation crates and the engine on purpose. The workspace
  # as a whole cannot build here - V8 has no prebuilt for these rows and the GUI
  # crates want GTK - and these are the crates whose behaviour differs per
  # platform. Native runners, so no cross `cc`. Every step runs even when an
  # earlier one failed, as they did when they were separate jobs.
  native:
    name: native (${{ matrix.os }})
    # full runs only
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # As in `test`.
      - name: Optimise dependencies
        shell: bash
        run: |
          # Not there yet on the macOS runners.
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          printf '[profile.dev.package."*"]\nopt-level = 2\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-${{ matrix.os }}-optdeps
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - name: Test
        run: cargo nextest run --locked -p gosub_ipc -p gosub_sandbox -p gosub_engine --no-fail-fast
      - name: Check (isolation enabled)
        if: ${{ !cancelled() }}
        run: cargo check --locked -p gosub_ipc -p gosub_sandbox -p gosub_engine --all-targets --target ${{ matrix.target }}
      - name: Check (isolation disabled)
        if: ${{ !cancelled() }}
        run: cargo check --locked -p gosub_ipc -p gosub_sandbox -p gosub_engine --all-targets --target ${{ matrix.target }} --no-default-features --features gosub_engine/sqlite_cookie_store

  # fmt and cargo-deny share a job: neither needs a build, so a job of their own
  # each is mostly runner setup. The job keeps the name `fmt`, which branch
  # protection requires, so a deny failure now blocks a merge as well. deny runs
  # even when fmt failed, as it did in its own job.
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - name: Run fmt
        run: cargo fmt --check --all
      - name: Run cargo-deny
        if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
