[package]
name = "example-mini-browser"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mini-browser"
path = "main.rs"

[dependencies]
gosub_engine = { path = "../../crates/gosub_engine" }
gosub_config = { path = "../../crates/gosub_config" }
gosub_render_pipeline = { path = "../../crates/gosub_render_pipeline" }
# The forked renderers rasterize with Cairo; no GTK/Pango — text is shaped by Parley.
gosub_renderer_cairo = { path = "../../crates/gosub_renderer_cairo", default-features = false }
gosub_fontmanager = { path = "../../crates/gosub_fontmanager" }
gosub_css3 = { path = "../../crates/gosub_css3" }
gosub_html5 = { path = "../../crates/gosub_html5" }
gosub_interface = { path = "../../crates/gosub_interface" }
cairo-rs = { workspace = true }
winit = { workspace = true }
softbuffer = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
url = { workspace = true }
log = { workspace = true }
simple_logger = { workspace = true }
